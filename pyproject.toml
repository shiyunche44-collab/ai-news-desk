[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-desk"
version = "0.1.0"
description = "AI 资讯编辑部：每天找 AI 新闻、写草稿、核查事实、改写成 X 帖子的多 agent 系统（第一版）"
readme = "README.md"
requires-python = ">=3.10"
# 核心只依赖 pydantic：模拟模型、测试、评测都不需要任何 API key 和网络。
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
# 接真实模型时再装。DeepSeek 和通义千问都兼容 OpenAI 接口格式，所以用 openai SDK；
# Claude 只在评测里做对照，用官方 anthropic SDK。
llm = ["openai>=1.40", "anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
newsroom = "newsroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
