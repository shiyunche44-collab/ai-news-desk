# 每天定时跑一次完整流程：采集真实信息源 → 选题 → 写 → 核查 → 改写，草稿导出成 Markdown。
#
# - 时间：每天 UTC 22:03，也就是台北时间早上 6:03（GitHub 高峰时可能晚几分钟到半小时）。
#   避开整点，整点是 GitHub 定时任务最挤的时候；这个时段也在 DeepSeek 的半价时段里。
# - 模型：仓库 Secrets 里有 DEEPSEEK_API_KEY 就用 DeepSeek，没有再看 DASHSCOPE_API_KEY（通义千问），
#   都没有就用模拟模型 mock，照样能跑通。key 只通过环境变量传给程序，日志里不会打印。
# - 草稿：每次跑完存进仓库的 drafts/ 文件夹（一次运行一个文件，按台北日期命名），
#   同时存成这次运行的产物（Artifacts，保留 30 天），也贴在运行页面的 Summary 里。
#   存之前先查一遍：要公开的文件里只要出现 key 或像 key 的字符串，这次就不存、不上传。
#   草稿没经过人审，标 ✗ 的事实没核对上。公开仓库谁都能看到 drafts/、运行页面和产物。
# - 权限：跑流程的那个任务只有只读权限；只有最后「存进仓库」那个任务能写仓库，而且它拿不到模型 key。
# - 系统不会自动发布任何内容。
name: daily

on:
  schedule:
    - cron: "3 22 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "用哪个模型（auto = 有哪个 key 用哪个，都没有就 mock）"
        type: choice
        options: [auto, mock, deepseek, qwen]
        default: auto
      sources:
        description: "信息源（live = arXiv + GitHub 真实数据，fixture = 仓库里的虚构示例）"
        type: choice
        options: [live, fixture]
        default: live
      picks:
        description: "选几条写"
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      model: ${{ steps.pick.outputs.model }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装
        run: pip install -e ".[dev,llm]"

      - name: 单元测试
        run: pytest

      - name: 选模型
        id: pick
        env:
          WANTED: ${{ inputs.model || 'auto' }}
          HAS_DEEPSEEK: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          HAS_QWEN: ${{ secrets.DASHSCOPE_API_KEY != '' }}
        run: |
          case "$WANTED" in
            auto)
              if [ "$HAS_DEEPSEEK" = "true" ]; then model=deepseek
              elif [ "$HAS_QWEN" = "true" ]; then model=qwen
              else model=mock; fi ;;
            deepseek)
              [ "$HAS_DEEPSEEK" = "true" ] || { echo "::error::没有设置 DEEPSEEK_API_KEY，见 README「部署到 GitHub Actions」"; exit 1; }
              model=deepseek ;;
            qwen)
              [ "$HAS_QWEN" = "true" ] || { echo "::error::没有设置 DASHSCOPE_API_KEY，见 README「部署到 GitHub Actions」"; exit 1; }
              model=qwen ;;
            *) model=mock ;;
          esac
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "这次用的模型：$model"

      # 把上次的数据库接着用，这样去重能和前几天的比，写过的新闻不会再写一遍。
      # 按模型分开存：换成真实模型后从头开始，不受模拟模型写过的影响。
      - name: 取回上次的数据库
        uses: actions/cache/restore@v4
        with:
          path: data/newsroom.db
          key: newsroom-db-${{ steps.pick.outputs.model }}-${{ github.run_id }}
          restore-keys: newsroom-db-${{ steps.pick.outputs.model }}-

      - name: 跑每日流程
        id: run
        env:
          MODEL: ${{ steps.pick.outputs.model }}
          SOURCES: ${{ inputs.sources || 'live' }}
          PICKS: ${{ inputs.picks || '3' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # 只用来调 GitHub 搜索接口（限额更高），权限是上面的只读
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$PICKS" in ''|*[!0-9]*) echo "::error::picks 要填数字"; exit 1 ;; esac
          if [ "$SOURCES" = "fixture" ]; then
            export NEWSROOM_SOURCES=fixture; live=""
          else
            export NEWSROOM_SOURCES=rss,github; live="--live-fetch"
          fi
          set +e
          newsroom run --model "$MODEL" --picks "$PICKS" $live | tee run.log
          code=${PIPESTATUS[0]}
          set -e
          # 1 = 今天没有产出草稿（比如周末 arXiv 不更新、候选都写过了），不算失败
          if [ "$code" = "1" ]; then
            echo "::warning::这次没有产出草稿"
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi

      - name: 导出草稿
        if: always() && steps.run.outcome == 'success'
        run: |
          newsroom review export --run latest --out out/drafts
          newsroom cost > cost.log || true

      # 只比对、不打印：key 只要出现在任何要公开的文件里，这一步就失败，后面不贴 Summary、不上传、不存进仓库
      - name: 检查要公开的文件里没有 key
        id: guard
        if: always() && steps.run.outcome == 'success'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          for k in "$DEEPSEEK_API_KEY" "$DASHSCOPE_API_KEY"; do
            [ -n "$k" ] || continue
            if grep -rqF -- "$k" out/drafts run.log cost.log 2>/dev/null; then
              echo "::error::要公开的文件里出现了 key，这次不公开草稿"; exit 1
            fi
          done
          if grep -rqE 'sk-[A-Za-z0-9]{20,}' out/drafts run.log cost.log 2>/dev/null; then
            echo "::error::要公开的文件里有像 key 的字符串，这次不公开草稿"; exit 1
          fi
          echo "没有发现 key"

      - name: 草稿贴进 Summary
        if: always() && steps.guard.outcome == 'success'
        run: |
          {
            echo "## 每日运行（模型：${{ steps.pick.outputs.model }}）"
            echo '```'
            cat run.log
            echo '```'
            echo '```'
            cat cost.log
            echo '```'
            for f in out/drafts/*.md; do
              [ -e "$f" ] || continue
              echo "---"
              cat "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传草稿
        if: always() && steps.guard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: drafts-${{ github.run_number }}
          path: |
            out/drafts/
            run.log
            cost.log
          retention-days: 30
          if-no-files-found: warn

      - name: 存下这次的数据库
        if: always() && steps.run.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/newsroom.db
          key: newsroom-db-${{ steps.pick.outputs.model }}-${{ github.run_id }}

  # 把这次的草稿存进仓库的 drafts/ 文件夹。这个任务能写仓库，但拿不到模型 key，
  # 只用上一步检查过、上传好的草稿文件。用自带的 GITHUB_TOKEN 推送，不会再触发别的工作流。
  save-drafts:
    needs: run
    if: needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: drafts-${{ github.run_number }}
          path: artifact

      - name: 存进 drafts/
        env:
          MODEL: ${{ needs.run.outputs.model }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          files=(artifact/out/drafts/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "这次没有草稿，不提交"
            exit 0
          fi
          day=$(TZ=Asia/Taipei date +%F)
          out="drafts/${day}-run${RUN_NUMBER}.md"
          mkdir -p drafts
          {
            echo "# ${day} 的草稿（运行 #${RUN_NUMBER}，模型：${MODEL}）"
            echo
            echo "系统自动生成，没经过人审。标 ✗ 的事实没核对上，发之前要先改。运行页面：${RUN_URL}"
            echo
            echo '```'
            cat artifact/run.log
            echo '```'
            for f in "${files[@]}"; do
              echo
              echo "---"
              echo
              cat "$f"
            done
          } > "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          git commit -q -m "草稿：${day}（运行 #${RUN_NUMBER}，${#files[@]} 篇）"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && { echo "已存到 $out"; exit 0; }
            sleep 5
          done
          echo "::error::推送失败"
          exit 1
